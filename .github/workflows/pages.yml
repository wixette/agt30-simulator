name: Deploy to GitHub Pages

# Publishes the repository as it is: there is nothing to build. It runs once the Tests
# workflow has passed on a push to main (or by hand), so a commit that fails the checks
# is never published. Repository settings: Pages > Source: GitHub Actions.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # the commit the tests passed on, not whatever main is by now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
