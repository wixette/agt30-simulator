<g font-size="12.5" fill="#333">
<text x="20" y="378"><tspan font-weight="bold">BR</tspan>: 30 lamps that are also push buttons, showing the buffer register; pressing one sets its bit. RESET BR clears it.</text>
<text x="20" y="398"><tspan font-weight="bold">PRI</tspan>: 30 toggle switches holding one instruction, shown here at 24000 77776 (MDIR 77776). PULSE 1 asks the processor</text>
<text x="20" y="416">to run it, through the PRI channel the selector picks (PULSE 1, or an outside device on HUB 1 or HUB 2).</text>
<text x="20" y="436"><tspan font-weight="bold">Controls</tspan>: ON, both OFFs together, RESET; STEP one instruction, CYCLE one machine cycle; HALT, RUN, PAUSE;</text>
<text x="20" y="454">BTSP (bootstrap); TE (Teletype error); IC 0, IC 1 (two interrupt-control bits).</text>
<text x="20" y="474" font-size="11" fill="#555">Redrawn from SRM5 (DPR3) p. 12, Figure 4, with the switch functions of pp. 13–14. NCSU built its own panel (MH26).</text>
</g></svg>