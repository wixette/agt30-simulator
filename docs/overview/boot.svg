<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1a1a1a">
  <title>Starting the machine</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
  <rect width="920" height="300" fill="#fff"/>
  <g stroke="#333" stroke-width="1.3">
    <rect x="20" y="40" width="150" height="150" rx="6" fill="#eeeeee"/>
    <rect x="200" y="40" width="200" height="150" rx="6" fill="#fdf0e4"/>
    <rect x="430" y="40" width="220" height="150" rx="6" fill="#e8f0fa"/>
    <rect x="680" y="40" width="220" height="150" rx="6" fill="#e8f0fa"/>
  </g>
  <g stroke="#333" stroke-width="2"><path d="M170 115H196" marker-end="url(#a)"/><path d="M400 115H426" marker-end="url(#a)"/><path d="M650 115H676" marker-end="url(#a)"/></g>
  <g font-weight="bold" text-anchor="middle"><text x="95" y="30">1. Power</text><text x="300" y="30">2. Bootstrap (BTSP)</text><text x="540" y="30">3. RUN from 0</text><text x="790" y="30">4. The monitor</text></g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="95" y="68">ON: power, core,</text><text x="95" y="84">reset released;</text><text x="95" y="100">the processor</text><text x="95" y="116">stops in HALT.</text><text x="95" y="146">RESET: a known</text><text x="95" y="162">starting state.</text>
    <text x="300" y="68">PAUSE mode; IC bit 28</text><text x="300" y="84">set (Teletype read-in,</text><text x="300" y="100">no printing). The</text><text x="300" y="116">bootstrap tape is read:</text><text x="300" y="132">about 80 words, five</text><text x="300" y="148">frames each, into core</text><text x="300" y="164">from location 0.</text>
    <text x="540" y="68">The bootstrap reads the</text><text x="540" y="84">monitor from the disk</text><text x="540" y="100">(cylinder 2 and the start</text><text x="540" y="116">of 3) into core at</text><text x="540" y="132">73400–77677, and jumps</text><text x="540" y="148">to 73400.</text>
    <text x="790" y="68">AMRMX starts, types a</text><text x="790" y="84">banner and asks the date:</text><text x="790" y="104" font-family="Menlo, Consolas, monospace">MO/DA/YR =</text><text x="790" y="128">Then it takes statements</text><text x="790" y="144">ending in "!". PULSE 1</text><text x="790" y="160">brings it back from any</text><text x="790" y="176">program.</text>
  </g>
  <g font-size="12" fill="#444">
    <text x="20" y="222">NCSU added a button that wrote the bootstrap's words into core directly, so the tape was not needed (MH26).</text>
    <text x="20" y="240">No copy of the bootstrap tape is known. The tripp tape's AMLD0, "the monitor loader for disk unit 0", reads cylinders 2–3</text>
    <text x="20" y="258">this way and may be what the tape held (our reading).</text>
    <text x="20" y="284" font-size="11.5" fill="#555">After SRM5 (DPR3) pp. 13–14 (BTSP, RUN, RESET, ON), MH26 (the call of 2026-11-19), and research/amrmx.md and ncsu-tapes.md.</text>
  </g>
</svg>
