version = 1

# Default: code is Apache-2.0; everything else of ours (docs, design and research
# notes, parameters, research data, images) is CC-BY-SA-4.0. More specific
# annotations override these defaults. Third-party material has its own
# annotations at the end; the licence texts are in LICENSES/ (docs/licensing.md).

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 agt30-simulator contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["**/*.js", "**/*.mjs", "**/*.json", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.css", "**/*.adept", ".gitattributes", ".gitignore", ".editorconfig", ".npmrc", "pnpm-lock.yaml", "**/*.webmanifest", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 agt30-simulator contributors"
SPDX-License-Identifier = "Apache-2.0"

# Research data and parameters are content, not code.
[[annotations]]
path = ["research/data/**", "params/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 agt30-simulator contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ---- Third-party material ----------------------------------------------------

# Vendored libraries, copied unchanged from npm (pnpm vendor); each keeps its LICENSE.
[[annotations]]
path = "vendor/three/**"
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 three.js authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/roboto-flex/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 The Roboto Flex Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "vendor/material-symbols/**"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"
